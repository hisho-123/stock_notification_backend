services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  monitor:
    profiles: [tools]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [monitor]
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
